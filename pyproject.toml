[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validator-documents"
version = "0.1.0"
description = "Validação e formatação de documentos brasileiros (CPF, CNPJ, PIS, Título Eleitoral, CNH, RENAVAM, Placa)."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "edmaker89", email = "edmaker@gmail.com"}]
keywords = ["cpf", "cnpj", "pis", "titulo-eleitoral", "cnh", "renavam", "placa", "validador", "brasil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typing-extensions>=4.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/edmaker89/validator_documents_package"
Repository = "https://github.com/edmaker89/validator_documents_package"
Issues = "https://github.com/edmaker89/validator_documents_package/issues"

[tool.hatch.build.targets.wheel]
packages = ["validator_documents"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--cov=validator_documents --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["validator_documents"]
omit = ["tests/*", "validator_documents/__init__.py"]
relative_files = true
branch = true

[tool.coverage.report]
fail_under = 90
precision = 2